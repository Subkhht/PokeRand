<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="28%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="48%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="250" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="160" cy="560" r="220" fill="#ef4444" opacity="0.12" filter="url(#glow)"/>

  <g opacity="0.12" fill="none" stroke="#94a3b8" stroke-width="3">
    <circle cx="1060" cy="510" r="150"/>
    <path d="M910 510h300M1060 360v300"/>
    <circle cx="1060" cy="510" r="42"/>
  </g>

  <image x="95" y="165" width="300" height="300" href="icon-512.png" xlink:href="icon-512.png" filter="url(#iconShadow)"/>

  <text x="450" y="292" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="96" fill="#f8fafc" letter-spacing="1">PokeRand</text>
  <text x="452" y="356" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="34" fill="url(#accent)">Roguelite de Pokémon</text>
  <text x="452" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#cbd5e1">Rutas aleatorias · Capturas · Evoluciones</text>
  <text x="452" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#cbd5e1">Clima · Habilidades reales · PvP</text>

  <rect x="452" y="500" width="330" height="54" rx="27" fill="rgba(16,185,129,0.16)" stroke="#10b981" stroke-width="2"/>
  <text x="617" y="535" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="22" fill="#6ee7b7">Juega gratis en el navegador</text>
</svg>
