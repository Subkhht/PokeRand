  <text x="256" y="286" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#letter)" stroke="#78350f" stroke-width="4" paint-order="stroke">R</text>

  <g fill="#fde047">
    <path d="M112 122l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" opacity="0.9"/>
    <path d="M404 360l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" opacity="0.75"/>
