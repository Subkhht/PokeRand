<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PokeRand">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="ballTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ballBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)" stroke="#1e293b" stroke-width="8"/>
  <circle cx="256" cy="252" r="206" fill="none" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="10"/>
  <circle cx="256" cy="252" r="222" fill="none" stroke="#ef4444" stroke-opacity="0.12" stroke-width="4"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="172" fill="url(#ballBottom)"/>
    <path d="M256 84a172 172 0 0 1 0 344V84z" fill="none"/>
    <path d="M84 256a172 172 0 0 1 344 0H84z" fill="url(#ballTop)"/>
    <path d="M84 256h344" stroke="#0f172a" stroke-width="34"/>
    <circle cx="256" cy="256" r="74" fill="url(#ring)" stroke="#0f172a" stroke-width="10"/>
    <circle cx="256" cy="256" r="58" fill="#0f172a"/>
    <circle cx="256" cy="256" r="48" fill="#111827"/>
    <path d="M256 84a172 172 0 0 1 0 344" fill="#ffffff" opacity="0.06"/>
